name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[app,build]"

      - name: Build the app with PyInstaller
        run: pyinstaller packaging/video_transcriber.spec --noconfirm --clean

      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          $version = python -c "import video_transcriber; print(video_transcriber.__version__)"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$version packaging\installer.iss

      - name: Install silently and self-test the installed app
        shell: pwsh
        run: |
          $setup = "dist\VideoTranscriber-Setup-$env:APP_VERSION.exe"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Video Transcriber\VideoTranscriber.exe"
          if (-not (Test-Path $exe)) { throw "Installed app not found at $exe" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\VideoTranscriber\VideoTranscriber.log" -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "Self-test failed with exit code $($proc.ExitCode)" }

      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item LICENSE dist\VideoTranscriber\
          Compress-Archive -Path dist\VideoTranscriber -DestinationPath "dist\VideoTranscriber-$env:APP_VERSION-windows-portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: VideoTranscriber-windows
          path: |
            dist/VideoTranscriber-Setup-*.exe
            dist/VideoTranscriber-*-windows-portable.zip

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/VideoTranscriber-Setup-*.exe
            dist/VideoTranscriber-*-windows-portable.zip
